openapi: 3.0.1
info:
  title: "Ecosyste.ms: Awesome"
  description: "An open API service for producing an overview of a list of open source projects."
  contact:
    name: Ecosyste.ms
    email: support@ecosyste.ms
    url: https://ecosyste.ms 
  version: 1.0.0
  license:
    name: CC-BY-SA-4.0
    url: https://creativecommons.org/licenses/by-sa/4.0/
externalDocs:
  description: GitHub Project
  url: https://github.com/ecosyste-ms/awesome
servers:
- url: https://awesome.ecosyste.ms/api/v1
paths:
  /projects:
    get:
      description: Get projects that have been synced.
      operationId: getProjects
      tags:
        - projects
      parameters:
        - name: page
          in: query
          description: Page number. Pages above 10000 are rejected with a 400 response.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: per_page
          in: query
          description: Number of records to return per page. Values above 1000 are reduced to 1000.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: keyword
          in: query
          description: Only return projects tagged with this repository topic. Must match the topic exactly.
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
  /projects/{id}:
    get:
      description: get a project by slug or id
      operationId: getProject
      tags:
        - projects
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Project slug in `host/owner/name` form. Slashes may be sent as-is or percent-encoded. A numeric project ID is also accepted and redirects to the slug URL.
          example: github.com/bcoe/awesome-cross-platform-nodejs
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{id}/lists:
    get:
      description: Get displayable lists that include a project.
      operationId: getProjectLists
      tags:
        - projects
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Project slug in `host/owner/name` form. Slashes may be sent as-is or percent-encoded. A numeric project ID is also accepted and redirects to the slug URL.
          example: github.com/bcoe/awesome-cross-platform-nodejs
        - name: page
          in: query
          description: Page number. Pages above 10000 are rejected with a 400 response.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: per_page
          in: query
          description: Number of records to return per page. Values above 1000 are reduced to 1000.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: topic
          in: query
          description: Only return lists tagged with this repository topic. Must match the topic exactly.
          required: false
          schema:
            type: string
        - name: language
          in: query
          description: Only return lists whose primary programming language is this one, e.g. `Ruby`. Must match exactly; TypeScript lists are counted as `JavaScript`.
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: Field to sort by. When neither `sort` nor `order` is given, lists are sorted by `stars`, most first. An unknown field, or `order` without `sort`, sorts by `updated_at`.
          required: false
          schema:
            type: string
            enum: [updated_at, created_at, stars, projects_count, name]
        - name: order
          in: query
          description: Sort direction. Any value other than `asc` sorts descending. Lists without a value for the sort field come last either way.
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/List'
  /projects/lookup:
    get:
      description: Look up a project by URL. If no project exists for the URL, one is created and a sync is enqueued, so the response may not include repository data yet. A sync is also enqueued for a project that hasn't been synced in the last day. Projects with blocked topics return 404.
      operationId: lookupProject
      tags:
        - projects
      parameters:
        - name: url
          in: query
          description: url of the project
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/Project'
  /projects/packages:
    get:
      description: get projects with packages
      operationId: getProjectPackages
      tags:
        - projects
      parameters:
        - name: page
          in: query
          description: pagination page number 
          required: false
          schema:
            type: integer
        - name: per_page
          in: query
          description: Number of records to return 
          required: false
          schema:
            type: integer
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
  /lists:
    get:
      description: Get displayable lists.
      operationId: getLists
      tags:
        - lists
      parameters:
        - name: page
          in: query
          description: Page number. Pages above 10000 are rejected with a 400 response.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: per_page
          in: query
          description: Number of records to return per page. Values above 1000 are reduced to 1000.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: topic
          in: query
          description: Only return lists tagged with this repository topic. Must match the topic exactly.
          required: false
          schema:
            type: string
        - name: language
          in: query
          description: Only return lists whose primary programming language is this one, e.g. `Ruby`. Must match exactly; TypeScript lists are counted as `JavaScript`.
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: Field to sort by. When neither `sort` nor `order` is given, lists are sorted by `stars`, most first. An unknown field, or `order` without `sort`, sorts by `updated_at`.
          required: false
          schema:
            type: string
            enum: [updated_at, created_at, stars, projects_count, name]
        - name: order
          in: query
          description: Sort direction. Any value other than `asc` sorts descending. Lists without a value for the sort field come last either way.
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/List'
  /lists/{id}:
    get:
      description: get a list by slug or id
      operationId: getList
      tags:
        - lists
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: List slug in `owner/name` form. Slashes may be sent as-is or percent-encoded. A numeric list ID is also accepted and redirects to the slug URL.
          example: sindresorhus/awesome
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
  /lists/{id}/projects:
    get:
      description: Get projects of a list in ascending project ID order.
      operationId: getListProjects
      tags:
        - lists
      parameters:
        - name: with_repository
          in: query
          description: Only return projects with repository data when true.
          required: false
          schema:
            type: boolean
            default: false
        - name: not_list
          in: query
          description: Exclude awesome lists when true.
          required: false
          schema:
            type: boolean
            default: false
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: List slug in `owner/name` form. Slashes may be sent as-is or percent-encoded. A numeric list ID is also accepted and redirects to the slug URL.
          example: sindresorhus/awesome
        - name: page
          in: query
          description: Page number. Pages above 10000 are rejected with a 400 response.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: per_page
          in: query
          description: Number of records to return per page. Values above 1000 are reduced to 1000.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: keyword
          in: query
          description: Only return projects tagged with this repository topic. Must match the topic exactly.
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
  /lists/{id}/list_projects:
    get:
      description: get list projects of a list
      operationId: getListListProjects
      tags:
        - lists
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: List slug in `owner/name` form. Slashes may be sent as-is or percent-encoded. A numeric list ID is also accepted and redirects to the slug URL.
          example: sindresorhus/awesome
        - name: category
          in: query
          description: category of the list project
          required: false
          schema:
            type: string
        - name: sub_category
          in: query
          description: sub category of the list project
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number. Pages above 10000 are rejected with a 400 response.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: per_page
          in: query
          description: Number of records to return per page. Values above 1000 are reduced to 1000.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListProject'
  /lists/lookup:
    get:
      description: Look up a list by URL. If no list exists for the URL, one is created and a sync is enqueued, so the response may not include repository data yet. A sync is also enqueued for a list that hasn't been synced in the last day. Unlike `GET /lists`, lists that aren't displayable are returned too.
      operationId: lookupList
      tags:
        - lists
      parameters:
        - name: url
          in: query
          description: url of the list
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/List'
  /topics:
    get:
      description: Get topics, most used on GitHub first.
      operationId: getTopics
      tags:
        - topics
      parameters:
        - name: page
          in: query
          description: Page number. Pages above 10000 are rejected with a 400 response.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: per_page
          in: query
          description: Number of records to return per page. Values above 1000 are reduced to 1000.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: query
          in: query
          description: Only return topics whose name or short description contains this text, ignoring case.
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Topic'
  /topics/{slug}:
    get:
      description: get a topic by slug
      operationId: getTopic
      tags:
        - topics
      parameters:
        - in: path
          name: slug
          schema:
            type: string
          required: true
          description: Slug of the topic, matched regardless of letter case.
          example: ruby
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        last_synced_at:
          type: string
          format: date-time
        repository:
          type: object
        owner:
          type: object
        packages:
          type: array
          items:
            type: object
        commits:
          type: object
        issues:
          type: object
        events:
          type: object
        keywords:
          type: array
          items:
            type: string
        dependencies:
          type: object
        score:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        avatar_url:
          type: string
        language:
          type: string
        category:
          type: string
        sub_category:
          type: string
        monthly_downloads:
          type: integer
        readme:
          type: string
        funding_links:
          type: array
          items:
            type: string
        readme_doi_urls:
          type: array
          items:
            type: string
        works:
          type: object
        categories:
          type: array
          items:
            type: string
        sub_categories:
          type: array
          items:
            type: string
    List:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        name:
          type: string
        description:
          type: string
        projects_count:
          type: integer
        last_synced_at:
          type: string
          format: date-time
        repository:
          type: object
        readme:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        primary_language:
          type: string
        list_of_lists:
          type: boolean
        displayable:
          type: boolean
        categories:
          type: array
          items:
            type: string
        sub_categories:
          type: array
          items:
            type: string
        projects_url:
          type: string
    Topic:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        short_description:
          type: string 
        url:
          type: string
        github_count:
          type: integer
        created_by:
          type: string
        logo_url:
          type: string
        released:
          type: string
        wikipedia_url:
          type: string
        related_topics:
          type: array
          items:
            type: string
        aliases:
          type: array
          items:
            type: string
        github_url:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ListProject:
      type: object
      properties:
        id:
          type: integer
        list_id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        description:
          type: string
        category:
          type: string
        sub_category:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        project:
          type: object
          $ref: '#/components/schemas/Project'